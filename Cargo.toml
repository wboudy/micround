[package]
name = "micround"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Live microscope wallpaper"

[features]
default = ["secure-zero"]
secure-zero = ["dep:zeroize"]
windows = ["dep:windows"]
macos = ["dep:objc2", "dep:block2"]
linux = ["dep:v4l", "dep:x11rb"]
# System tray integration - requires GTK3 on Linux
tray = ["dep:tray-icon", "dep:muda"]
# Global keyboard shortcuts
hotkeys = ["dep:global-hotkey"]
# Crash recovery support
recovery = []
# Test simulator for headless testing - generates synthetic frames
test-simulator = []
# Clipboard support for snapshot feature (requires platform-specific deps)
clipboard = []

[dependencies]
# Graphics - wgpu handles platform selection automatically
wgpu = "0.20"

# UI
egui = "0.28"
winit = "0.29"
tray-icon = { version = "0.19", optional = true }
muda = { version = "0.15", optional = true }
global-hotkey = { version = "0.6", optional = true }

# Async
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }

# Serialization
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Error handling
thiserror = "1"
anyhow = "1"

# Filesystem
dirs = "5"

# Time/Date
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Image processing
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# GPU data transfer
bytemuck = { version = "1", features = ["derive"] }

# Secure memory zeroing (prevents compiler optimization of privacy-critical zeroing)
zeroize = { version = "1", optional = true }

# Platform: Windows
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", optional = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    # Media Foundation for camera capture
    "Win32_Media_MediaFoundation",
    "Win32_Media",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    # Direct3D 11 for GPU-accelerated wallpaper rendering
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

# Platform: macOS
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.5", optional = true }
block2 = { version = "0.5", optional = true }

# Platform: Linux
[target.'cfg(target_os = "linux")'.dependencies]
v4l = { version = "0.14", optional = true }
x11rb = { version = "0.13", optional = true }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
serial_test = "3"

[profile.release]
lto = true
opt-level = 3

[[bin]]
name = "micround"
path = "src/main.rs"
